    .screen {

      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 3rem;
      transition: opacity 1s ease-in-out;
      opacity: 0;
      z-index: 0;
    }

    .active {

    }

    .top-left {
      left: 10px;
    }

    .top-right {
      right: 10px;
    }

    .center-image {

    .footer-overlays img {
      width: 60px;
      height: auto;
    }

    .footer-center {
      position: absolute;
      left: 50%;

<script>
const tutorialSteps = [
  { text: "Olá! Quando piscar um icone, clica nele e memoriza", x: 70, y: 120, fingerX: 220, fingerY: 150 },
  { text: "Click no icone a sua escolha", x: 20, y: 150, fingerX: 100, fingerY: 180 },
  { text: "Quando piscar o próximo icone, não clica. Apenas memoriza", x: 20, y: 300, fingerX: -1050, fingerY: -3050 },
  { text: "Agora clica no primeiro icone memorizado", x: 70, y: 120, fingerX: 220, fingerY: 150 },
  { text: "Agora clica no segundo icone memorizado", x: 20, y: 150, fingerX: 100, fingerY: 180 },
  { text: "Agora clica no terceiro icone memorizado", x: 20, y: 250, fingerX: 120, fingerY: 300 },
  { text: "Se errar na sequência, EXPLODE!", x: 20, y: 250, fingerX: -1020, fingerY: -3000 }
];
let tutorialIndex = 0;

function startTutorial() {
  tutorialIndex = 0;
  showTutorialStep();
  setTimeout(() => {jogando();}, 2000);
}

function showTutorialStep() {
  const balloon = document.getElementById("tutorial-balloon");
  const finger = document.getElementById("tutorial-finger");
  const step = tutorialSteps[tutorialIndex];

  balloon.style.left = step.x + "px";
  balloon.style.top = step.y + "px";
  document.getElementById("tutorial-text").innerText = step.text;
  balloon.style.display = "block";

  finger.style.left = step.fingerX + "px";
  finger.style.top = step.fingerY + "px";
  finger.style.display = "block";
}

function nextTutorial() {
  tutorialIndex++;
  if (tutorialIndex >= tutorialSteps.length) {
    document.getElementById("tutorial-balloon").style.display = "none";
    document.getElementById("tutorial-finger").style.display = "none";
  } else {
    showTutorialStep();
  }
}
